# `cargo audit` : les avis RustSec écartés, chacun avec sa raison.

[advisories]
ignore = [
    # crypto-bigint 0.5 (branches possibles dans des calculs à temps constant),
    # corrigé seulement en 0.7. Le relais a déjà migré (p256 0.14). Reste le
    # navigateur (client/, p256 0.13) : y passer change aussi son générateur
    # aléatoire (rand_core, getrandom sous WebAssembly), à faire à part et à
    # vérifier avec les vecteurs de vectors.json. Pour en profiter, un
    # attaquant doit mesurer finement le processeur de l'appareil de la
    # victime, pendant qu'elle utilise ses propres clés.
    "RUSTSEC-2026-0387",
]
