# Le projet Xcode de l'application iOS, décrit pour XcodeGen :
#   brew install xcodegen && cd ios && xcodegen && open Talka.xcodeproj
#
# Le relais intégré à l'application : TALKA_SERVER, que la CI remplit avec
# TALKA_API_URL (vide → le relais officiel, `TalkaServer.official`). Il n'y
# a rien à choisir dans l'application.
name: Talka
options:
  bundleIdPrefix: com.maxlestage
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  developmentLanguage: fr
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    TALKA_SERVER: ""
packages:
  TalkaKit:
    path: .
  # WebRTC (Google), compilé pour iOS : les appels audio et vidéo.
  WebRTC:
    url: https://github.com/stasel/WebRTC
    from: 155.0.0
targets:
  Talka:
    type: application
    platform: iOS
    sources:
      - path: Talka
    dependencies:
      - package: TalkaKit
        product: TalkaKit
      - package: WebRTC
        product: WebRTC
      # L'app de la montre, livrée dans celle de l'iPhone (dossier Watch).
      - target: TalkaWatch
      # Les widgets (écran d'accueil, écran verrouillé).
      - target: TalkaWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.talka
        CODE_SIGN_ENTITLEMENTS: Shared.entitlements
        PRODUCT_NAME: Talka
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Talka/Info.plist
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  # Talka sur l'Apple Watch : les discussions de l'iPhone, par WatchConnectivity.
  TalkaWatch:
    type: application
    platform: watchOS
    sources:
      - path: TalkaWatch
      # Ce que l'iPhone et la montre s'échangent : le même fichier des deux côtés.
      - path: Sources/TalkaKit/WatchLink.swift
      - path: Sources/TalkaKit/WidgetData.swift
    dependencies:
      # Les complications, livrées dans l'app de la montre.
      - target: TalkaWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.talka.watchkitapp
        CODE_SIGN_ENTITLEMENTS: Shared.entitlements
        PRODUCT_NAME: TalkaWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: TalkaWatch/Info.plist
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
  # Les widgets : le même code pour l'iPhone et la montre (TalkaWidgets/).
  TalkaWidgets:
    type: app-extension
    platform: iOS
    sources: &widgetSources
      - path: TalkaWidgets
      - path: Sources/TalkaKit/WatchLink.swift
      - path: Sources/TalkaKit/WidgetData.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.talka.widgets
        PRODUCT_NAME: TalkaWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: WidgetsSupport/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shared.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
  TalkaWatchWidgets:
    type: app-extension
    platform: watchOS
    sources: *widgetSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maxlestage.talka.watchkitapp.widgets
        PRODUCT_NAME: TalkaWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        INFOPLIST_FILE: WidgetsSupport/Info.plist
        CODE_SIGN_ENTITLEMENTS: Shared.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
schemes:
  Talka:
    build:
      targets:
        Talka: all
    run:
      config: Debug
    archive:
      config: Release
