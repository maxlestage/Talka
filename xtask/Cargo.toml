[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Les tâches de Talka, en Rust : compilation du navigateur en WebAssembly, GitHub Pages"
publish = false

# Un espace de travail à part : il se construit sans le reste.
[workspace]

[dependencies]
# Le générateur de wasm-bindgen, en bibliothèque : pas d'outil à installer.
# Même version que la crate wasm-bindgen de client/.
wasm-bindgen-cli-support = "=0.2.129"
ureq = { version = "3", features = ["json"] }
serde_json = "1"
