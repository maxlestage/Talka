[package]
name = "talka-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Le navigateur de Talka, en Rust compilé en WebAssembly : codes, chiffrement, IndexedDB, discussions, appels WebRTC, site"
publish = false

# Une seule crate pour les deux côtés : compilée en WebAssembly, c'est tout le
# code du navigateur ; compilée normalement, ses modules `code` et `crypto`
# servent aux tests du serveur (exactement le même chiffrement).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
aes-gcm = "0.10"
hkdf = "0.12"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
base64 = "0.22"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Le QR code de votre code, dessiné dans le navigateur.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# La mémoire de Talka : Memoire ORM (moteur en mémoire, en pur Rust), dont
# les lignes sont gardées dans IndexedDB (voir `store`).
memoire-orm = { git = "https://github.com/maxlestage/Memoire", default-features = false, features = ["memory", "web"] }
# Le protocole v3 (sessions à double cliquet, établissement hybride X25519 +
# ML-KEM-768) : l'implémentation de référence de Brocolis 🥦, la même que
# celle de l'app. Voir `v3`.
brocolis-proto = { git = "https://github.com/maxlestage/Messagerie-", rev = "32c386e3deaed316994f338a182ec2e544bface0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
