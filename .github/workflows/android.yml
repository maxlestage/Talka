# L'application Android (android/) : les tests du protocole et du cœur
# (Kotlin pour la JVM, contre les vecteurs du navigateur), puis les APK :
# celui du téléphone et celui de la montre (Wear OS).
#
# L'APK est signé par la clé du dépôt si ses secrets sont là
# (TALKA_KEYSTORE_B64, TALKA_KEYSTORE_PASSWORD, TALKA_KEY_ALIAS,
# TALKA_KEY_PASSWORD) : chaque version s'installe alors par-dessus la
# précédente. Sans eux, il est signé par une clé de débogage jetable.
# La montre est signée par la même clé que le téléphone : la couche de
# données de Wear OS ne relie que deux applications signées pareil.
# Ils se téléchargent depuis la page de l'exécution (artefacts
# « talka-android » et « talka-wear »).

name: Android

on:
  push:
    paths:
      - "android/**"
      - "ios/Tests/TalkaKitTests/vectors.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  android:
    name: Android (protocole, cœur, APK du téléphone et de la montre)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          # Pas le paquet « tools » par défaut : il n'existe plus.
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Protocole et cœur — tests (vecteurs du navigateur)
        run: ./gradlew --no-daemon :brocolis:test :talkakit:test
      - name: Clé de signature
        env:
          TALKA_KEYSTORE_B64: ${{ secrets.TALKA_KEYSTORE_B64 }}
          TALKA_KEYSTORE_PASSWORD: ${{ secrets.TALKA_KEYSTORE_PASSWORD }}
          TALKA_KEY_ALIAS: ${{ secrets.TALKA_KEY_ALIAS }}
        run: |
          if [ -n "$TALKA_KEYSTORE_B64" ]; then
            # Les blancs copiés avec les secrets (retour à la ligne, espace) ne comptent pas.
            printf '%s' "$TALKA_KEYSTORE_B64" | tr -d ' \t\r\n' | base64 -d > "$RUNNER_TEMP/talka.jks"
            echo "TALKA_KEYSTORE=$RUNNER_TEMP/talka.jks" >> "$GITHUB_ENV"
            # La clé s'ouvre-t-elle avec ces secrets ? Sinon, dire lequel ne va pas.
            pass=$(printf '%s' "$TALKA_KEYSTORE_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            alias=$(printf '%s' "$TALKA_KEY_ALIAS" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
            if ! KS_PASS="$pass" keytool -list -keystore "$RUNNER_TEMP/talka.jks" -storepass:env KS_PASS > /dev/null 2>&1; then
              echo "::error::TALKA_KEYSTORE_PASSWORD n'ouvre pas la clé de TALKA_KEYSTORE_B64 : les deux secrets ne vont pas ensemble."
              exit 1
            fi
            if ! KS_PASS="$pass" keytool -list -keystore "$RUNNER_TEMP/talka.jks" -storepass:env KS_PASS -alias "$alias" > /dev/null 2>&1; then
              echo "::error::TALKA_KEY_ALIAS ne nomme aucune clé de TALKA_KEYSTORE_B64."
              exit 1
            fi
            echo "La clé de signature s'ouvre avec les secrets."
          else
            echo "::notice::Pas de clé de signature dans les secrets : APK signé par une clé de débogage."
          fi
      - name: Applications du téléphone et de la montre — tests (Robolectric) et APK
        env:
          TALKA_KEYSTORE_PASSWORD: ${{ secrets.TALKA_KEYSTORE_PASSWORD }}
          TALKA_KEY_ALIAS: ${{ secrets.TALKA_KEY_ALIAS }}
          TALKA_KEY_PASSWORD: ${{ secrets.TALKA_KEY_PASSWORD }}
          TALKA_VERSION_CODE: ${{ github.run_number }}
          TALKA_VERSION_NAME: 1.0.${{ github.run_number }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :wear:testDebugUnitTest :wear:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: talka-android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: talka-wear
          path: android/wear/build/outputs/apk/release/*.apk
          if-no-files-found: error
