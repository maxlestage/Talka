name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            xtask
      - run: cargo fmt --all --check
      - name: Le navigateur, en WebAssembly
        run: cargo xtask web
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy -p talka-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test --workspace
      - name: Export GitHub Pages
        run: BASE_PATH=/Talka cargo run --quiet -- export dist && test -f dist/app/index.html
